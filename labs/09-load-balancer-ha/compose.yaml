services:
  web01:
    image: nginx:alpine
    volumes:
      - ./web01/index.html:/usr/share/nginx/html/index.html:ro
  web02:
    image: nginx:alpine
    volumes:
      - ./web02/index.html:/usr/share/nginx/html/index.html:ro
  lb:
    image: nginx:alpine
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web01
      - web02
